[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anet4d"
dynamic = ["version"]
description = "ANet4D benchmark SDK: agent interface, wire-protocol runner, reference baselines, reference detector and bench API client"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ANet Research" }]
keywords = ["embodied agents", "multi-agent", "uav", "benchmark", "active perception", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 核心依赖只含线协议（msgpack）与 bench-api 客户端（httpx）；L1 Agent 与基线策略只需这两项（M26-FR-080，不依赖 awr）。
dependencies = ["httpx>=0.27", "msgpack>=1.0"]

[project.optional-dependencies]
# L2 观测：参考检测器 ref_det_v1 的 numpy 推理与 JPEG 解码（M26-FR-121）。images 为 l2 的旧名，保留兼容。
l2 = ["numpy>=1.26", "pillow>=10"]
images = ["numpy>=1.26", "pillow>=10"]

[project.scripts]
# 容器入口，与 `python -m anet4d.serve` 等价：anet4d-agent pkg.module:Factory [--sock PATH] | --baseline NAME
anet4d-agent = "anet4d.serve:main"
# 已弃用的旧名（兼容别名包 drone4d，保留一个版本，V0.3.2 之后移除）：行为同 anet4d-agent，启动时在 stderr 提示改用新名
drone4d-agent = "drone4d.serve:main"

[project.urls]
Homepage = "https://github.com/ANetResearch/ANet4D"
Documentation = "https://docs.agentnetwork.org.cn/anet4d/"
Source = "https://github.com/ANetResearch/ANet4D/tree/main/tools/sdk/anet4d"

[tool.setuptools.dynamic]
version = { attr = "anet4d.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 参考检测器定稿权重与模型卡（WEIGHTS_SHA256 在载入时校验），随 wheel 与 sdist 发布。
"anet4d.perception" = ["ref_det_v1.npz", "model_card.json"]
