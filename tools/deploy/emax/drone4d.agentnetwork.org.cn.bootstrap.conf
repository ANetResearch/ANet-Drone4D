# /etc/nginx/sites-available/drone4d.agentnetwork.org.cn.conf 的首次引导版本（只有 80 端口）：
# 证书还不存在时，正式站点文件里的 443 段会让 nginx -t 失败。首次部署先启用本文件，certbot webroot 申请到 ECDSA 证书后，
# 再用正式的 drone4d.agentnetwork.org.cn.conf 覆盖同一路径并 reload（步骤见 README.md「首次部署」）。
# 只新增本站点，不修改其他站点。

server {
    listen 80;
    listen [::]:80;
    server_name drone4d.agentnetwork.org.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        return 503 "drone4d.agentnetwork.org.cn: certificate pending\n";
    }
}
