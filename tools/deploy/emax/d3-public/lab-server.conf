    # ---- D3 公开只读样例（扩展点 16；AWR-05 §7.9、AWR-17 §18.8.5、M27 §8.5；D3-AC-21） -------------------------------------
    # 由 tools/deploy/emax/d3-public/labsite.py render 插入 443 server 的"前端构建产物"段之前；回滚到 D2 时整段随 D2 站点文件消失。
    # 目录（labctl.py 维护，dmax 单向同步）：
    #   /srv/drone4d/lab/<build>/          /lab/ 独立静态构建（VITE_AWR_LAB_ONLY = 1、base /lab/）；current 为指向当前构建的符号链接
    #   /srv/drone4d/lab-static/index.json  drone4d.lab_static_index.v1，版本目录之外，no-cache（ETag），写临时文件后 rename
    #   /srv/drone4d/lab-static/v/<ver>/    版本目录（YYYY.MM.DD-n），immutable；.staging 与其他以点开头的目录一律不直出
    # 全部只允许 GET 与 HEAD（其余 405，判定用 lab-http.conf 的 map：if 中的正则会覆盖 location 正则的 $1、$2）；nginx 不比对制品与索引的版本，旧页面拿到的旧版本目录在保留期内仍可读。

    # D3 接口在公开站一律 404，不回源（公开组合根 AWR_D3_ENABLED = 0；v1.3 不再开放 /api/bench/v1/public/**）
    location = /api/bench {
        return 404;
    }
    location ^~ /api/bench/ {
        return 404;
    }

    # /lab/ 独立静态构建：带内容摘要的 assets/ 为 immutable，缺失时 404（不回退到 index.html，以免把 HTML 当脚本缓存一年）
    location = /lab {
        return 301 /lab/;
    }
    location ^~ /lab/assets/ {
        alias /srv/drone4d/lab/current/assets/;
        limit_req zone=anet4d_static burst=200 nodelay;
        if ($anet4d_lab_bad_method) {
            return 405;
        }
        location ~ /\. {
            return 404;
        }
        try_files $uri =404;
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # 其余 /lab/**：存在的文件直出，其余路径回退到 /lab/index.html（History API 路由 /lab/samples/:sid，AWR-14 §21.14）；no-cache
    location ^~ /lab/ {
        alias /srv/drone4d/lab/current/;
        limit_req zone=anet4d_static burst=200 nodelay;
        if ($anet4d_lab_bad_method) {
            return 405;
        }
        location ~ /\. {
            return 404;
        }
        try_files $uri /lab/index.html;
        index index.html;
        autoindex off;
        etag on;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 制品索引：版本目录之外、no-cache（ETag 复核），新版本发布后访客立即可见（17 §18.8.5 规则 1）
    location = /lab-static/index.json {
        alias /srv/drone4d/lab-static/index.json;
        limit_req zone=anet4d_static burst=100 nodelay;
        if ($anet4d_lab_bad_method) {
            return 405;
        }
        default_type application/json;
        etag on;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # 制品：只经版本化前缀访问且 immutable。版本名须为 YYYY.MM.DD-n，路径段不得以点开头（.staging、..、隐藏文件均落到下面的 404）。
    # 带宽（AWR-05 §7.9 实现约束 4）：前 8 MiB 不限（只对从头开始的整段下载，见 lab-http.conf），其后每个请求 2 MiB/s；每个地址
    # 前缀并发 4、全站并发 32，超出 429（server 层 limit_conn_status）。单文件 ≤ 64 MiB 由发布线保证（labctl.py check）。
    location ~ "^/lab-static/v/(\d{4}\.\d{2}\.\d{2}-\d+)/((?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*)$" {
        alias /srv/drone4d/lab-static/v/$1/$2;
        if ($anet4d_lab_bad_method) {
            return 405;
        }
        limit_req zone=anet4d_static burst=200 nodelay;
        limit_conn anet4d_lab_ip 4;
        limit_conn anet4d_lab_all 32;
        limit_rate_after $anet4d_lab_rate_after;
        limit_rate 2m;
        # 每次写事件最多发送 256 KiB 后让出 worker（ngx_http_write_filter：send_chain 的上限取 sendfile_max_chunk，未发完的挂到
        # posted_next_events，对 TLS 同样生效；缺省 2m）。共享展示的 WS 与下载由同一组 worker 转发，2 MiB 一次的加密与写出会推迟
        # 同一 worker 上的 WS 帧（D3-AC-21：16 路并发下载期间 WS 推送时延 p95 增幅 ≤ 10 %）
        sendfile_max_chunk 256k;
        types {
            application/json          json geojson;
            video/mp4                 mp4;
            application/octet-stream  bin rrd awrv f32 u8 u16 npy;
            text/plain                txt md;
        }
        default_type text/plain;
        charset_types text/plain;
        etag on;
        max_ranges 1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # 其余 /lab-static/**（目录本身、current 别名、.staging、非法版本名）一律 404；普通前缀 location，上面的正则优先
    location /lab-static/ {
        return 404;
    }

