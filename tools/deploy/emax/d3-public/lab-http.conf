# tools/deploy/emax/d3-public/lab-http.conf：D3 公开只读样例的 http 层增补（扩展点 16；AWR-05 §7.9 实现约束 1–4、AWR-17 §18.8.5、
# M27 §8.5；D3-AC-21）。不单独安装：labsite.py render 把本文件插入 D2 站点文件 drone4d.agentnetwork.org.cn.conf 的
# "# ---- 80" 段之前，生成带 /lab/ 的站点文件；回滚到 D2 时重新安装 D2 标签构建自带的站点文件即可（本文件的内容随之消失）。
# 名字一律带 drone4d_lab 前缀，不与同机其他站点和 D2 的区冲突；键沿用 D2 的地址前缀 $drone4d_prefix（IPv4 /32、IPv6 /64）。

# /lab-static/v/ 的并发下载：每个地址前缀 4 条（"每 IP limit_conn 4"），全站 32 条（"D3 下载连接全站 ≤ 32"）。
# $server_name 在本站点恒为同一个非空值，因此第二个区只有一个键，即全站计数。HTTP/2 下每个并发请求按一条连接计。
limit_conn_zone $drone4d_prefix zone=drone4d_lab_ip:10m;
limit_conn_zone $server_name    zone=drone4d_lab_all:1m;

# "前 8 MB 不限"只给从头开始的整段下载：不带 Range 或 Range 为 bytes=0- 的请求前 8 MiB 不限速，其余分段请求从第一个字节起按
# limit_rate 限速。否则访客可以按 8 MiB 一段反复发 Range 请求绕过 limit_rate（每个请求各算一次 limit_rate_after）。
# limit_rate_after 自 nginx 1.17.0 起接受变量（emax 为 1.24）。
map $http_range $drone4d_lab_rate_after {
    ""            8m;
    "bytes=0-"    8m;
    default       0;
}

# 只允许 GET 与 HEAD。以 map 判定而不在 location 内写 `if ($request_method !~ …)`：if 中的正则匹配会覆盖 location 正则的捕获
# （$1、$2），使 /lab-static/v/ 的 alias 指向空路径。
map $request_method $drone4d_lab_bad_method {
    GET     0;
    HEAD    0;
    default 1;
}
