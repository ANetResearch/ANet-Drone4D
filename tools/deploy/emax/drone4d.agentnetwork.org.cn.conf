# /etc/nginx/sites-available/drone4d.agentnetwork.org.cn.conf（启用：ln -s 到 sites-enabled）
# ANet Drone4D 公开演示站 V0.2-demo（T4，AWR-19 §3.7；ADR-085 的 D1 拓扑加 ADR-092、ADR-109、ADR-119、ADR-120、ADR-123）。
# 只新增本站点：本文件的 limit_req/limit_conn 区域、upstream、map 变量、proxy_cache 区域与 SSL 会话缓存名字都带 drone4d 前缀，
# 不与本机其他站点冲突；不修改 nginx.conf 与其他站点的任何配置。
# 证书由 certbot webroot（/var/www/certbot）以 ECDSA 申请；首次申请证书前先用 drone4d.agentnetwork.org.cn.bootstrap.conf。
# 适用 nginx 1.24（Ubuntu 24.04）：http2 写在 listen 上（http2 指令自 1.25.1 起才有）。
#
# 路径分流（AWR-04 §4.1、§4.7 第 3 条；M17 PRD §8.2）：
#   /api/sandbox/**（REST 与会话 WS）            → sandbox-api 127.0.0.1:18641（沙盒，按会话的 GatewayHub）
#   其余 /api/**、/api/rt                         → show-api 127.0.0.1:18640（D1 api：共享展示、观看排队、内部身份）
#   /worlds/<七个世界>/**、/worlds/_shared/env/** → nginx alias 直出 /opt/anet-drone4d/var/worlds（Range、ETag、缓存头与安全头）
#   /sdk/**                                       → alias 当前发布的 tools/sdk/（Python SDK 与示例）
#   /build-info.json、/manifest.webmanifest       → alias 当前发布的前端构建，no-cache（AWR-04 §15.4、§15.8.7）
#   其余（前端、落地页媒体、SPA 回退）            → show-api
# 日志：nginx 的默认日志格式只记请求行与状态，不记请求体与 Authorization、X-AWR-Identity、Sec-WebSocket-Protocol 头；
# 不要为本站点启用记录请求头或请求体的自定义日志格式（内部身份口令与令牌不得进入任何日志，AWR-04 §15.9.5）。

# ---- 地址前缀键（AWR-04 §11.5；M17 PRD §6.6.7）--------------------------------------------------------------------
# 限流与连接数按"地址前缀"计：IPv4 取整个地址（/32）；IPv6 取 /64，键为前 4 组的十六进制文本（如 2001:db8:0:1）。
# $remote_addr 是 inet_ntop 的规范压缩文本（小写、无前导零、只压缩连续 ≥ 2 组的 0），因此按 "::" 之前的组数 p 与之后的组数 k
# 就能补出前 4 组：p ≥ 4 时直接取前 4 组；p = 0、1、2、3 时 "::" 至少代表 2 组 0，只有 p = 0 且 k = 5、6 与 p = 1 且 k = 5 时
# "::" 之后的组落在前 4 组之内，各写一条。每个 /64 恰好对应一个键（与 awr.api.public.prefix_of 对拍：tests/ops/
# test_deploy_nginx.py）；IPv4 映射地址（::ffff:a.b.c.d）按 IPv4。聚合前缀（/24、/48）与精确计数由 sandbox-pool 与两个 api
# 执行，nginx 只做粗粒度限流。
map $remote_addr $drone4d_prefix {
    "~^::ffff:(?<drone4d_v4m>[0-9]{1,3}(\.[0-9]{1,3}){3})$"                       $drone4d_v4m;
    "~^(?<drone4d_g4>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"   $drone4d_g4;
    "~^::(?<drone4d_z1>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"                        "0:0:0:$drone4d_z1";
    "~^::(?<drone4d_z2>[0-9a-f]{1,4}:[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"          "0:0:$drone4d_z2";
    "~^::"                                                                       "0:0:0:0";
    "~^(?<drone4d_o1>[0-9a-f]{1,4})::(?<drone4d_o2>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$" "$drone4d_o1:0:0:$drone4d_o2";
    "~^(?<drone4d_p1>[0-9a-f]{1,4})::"                                           "$drone4d_p1:0:0:0";
    "~^(?<drone4d_p2>[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                             "$drone4d_p2:0:0";
    "~^(?<drone4d_p3>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"               "$drone4d_p3:0";
    default                                                                      $remote_addr;
}

# 区名带 _v2：V0.2 把这五个区的键由 $binary_remote_addr 改为 $drone4d_prefix，nginx 不允许 reload 改变已有共享内存区的键
# （emerg：limit_req ... uses the ... key while previously it used ...，reload 被拒、旧配置继续生效），改名后 reload 新建区，
# 无需重启 nginx（同机其他站点不受影响）。以后再改任一区的键，同样换新名字。
# ---- 限流与连接（按地址前缀；两个 api 另有同口径的令牌桶、WS 上限与配额，17 §3.4、AWR-04 §11.5） -----------------------
limit_req_zone  $drone4d_prefix zone=drone4d_api_v2:10m       rate=20r/s;   # 一般 API（两个 api 共用）
limit_req_zone  $drone4d_prefix zone=drone4d_token_v2:10m     rate=30r/m;   # 匿名 token 签发（只签 viewer）
limit_req_zone  $drone4d_prefix zone=drone4d_identity:10m  rate=30r/m;   # 内部身份 R79（0.5 次/s；锁定与常量时延在 show-api）
limit_req_zone  $drone4d_prefix zone=drone4d_sb_create:10m rate=2r/m;    # 沙盒创建（精确的"每前缀 6 次/h"在池内执行）
limit_req_zone  $drone4d_prefix zone=drone4d_static_v2:10m    rate=60r/s;   # 静态世界、前端与 SDK
limit_conn_zone $drone4d_prefix zone=drone4d_conn_v2:10m;                   # 每前缀并发连接
limit_conn_zone $drone4d_prefix zone=drone4d_ws_v2:10m;                     # 共享展示 /api/rt（每前缀 4）
limit_conn_zone $drone4d_prefix zone=drone4d_sbws:10m;                   # 沙盒会话 WS（每前缀 4）

# 容量接口 1 s 微缓存（AWR-04 §15.5.4、ADR-119：无论访客多少，到达 sandbox-api 的请求 ≤ 1 次/s）。目录由 nginx 主进程在
# 启动或 nginx -t 时创建（父目录 /var/lib/nginx 由 Ubuntu 的 nginx 包提供）；只缓存这一个无参数、无访客标识的公开端点
proxy_cache_path /var/lib/nginx/drone4d-micro levels=1 keys_zone=drone4d_micro:1m max_size=8m inactive=10m use_temp_path=off;

upstream drone4d_backend {
    server 127.0.0.1:18640;   # show-api 只监听回环（AWR_PORT，public profile 缺省 18640）
    keepalive 16;
}

upstream drone4d_sandbox {
    server 127.0.0.1:18641;   # sandbox-api 只监听回环（sandbox.port，public profile 18641）
    keepalive 16;
}

# WebSocket 升级：有 Upgrade 头时转发 upgrade，否则保持长连接（keepalive 到 upstream）
map $http_upgrade $drone4d_connection_upgrade {
    default upgrade;
    ''      '';
}

# 世界文件的缓存头（与 show-api 的 /worlds 静态路由同口径，M11-FR-082）：带 ?v=<contentVersion> 的请求为 immutable，
# 不带时 no-cache + ETag（world.json 另有 location，恒为 no-cache）。nginx 不比对 ?v= 与当前 contentVersion（show-api 对
# 不一致返回 409 310）：世界包只随发布更新，更新后 world.json（no-cache）立即给出新的 contentVersion
map $arg_v $drone4d_world_cc {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

# ---- 80：只服务 ACME 校验，其余 301 到 https ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name drone4d.agentnetwork.org.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：TLS 终止、路径分流、静态世界与反向代理 --------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drone4d.agentnetwork.org.cn;

    ssl_certificate     /etc/letsencrypt/live/drone4d.agentnetwork.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drone4d.agentnetwork.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:drone4d_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 只对本主机名生效（不带 includeSubDomains，以免影响同域其他站点）。注意：location 内一旦出现 add_header 就不再继承
    # 这一行，因此下文每个带 add_header 的 location 都重复写 HSTS；反向代理的响应由 api 自带 COOP、COEP、CORP、nosniff 与
    # Referrer-Policy（middleware.SECURITY_HEADERS），nginx 不在 server 层重复添加（重复的 COOP 会被浏览器当作无效值）
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;        # api 的 REST 请求体上限同为 1 MiB（17 §3.4；沙盒配置快照 ≤ 512 KiB）
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn drone4d_conn_v2 48;     # 每个地址前缀的并发连接（HTTP/2 多路复用；点云 Range 请求走同一连接）

    # 压缩：只压文本、脚本、样式、JSON 与 SVG；点云 .bin、环境 .awrv 等二进制（application/octet-stream）与图片不压缩，
    # 206 分段响应 nginx 本就不压缩。反向代理的缓存头（immutable、no-cache + ETag）由 api 给出，这里原样透传。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/problem+json application/manifest+json image/svg+xml text/x-python text/markdown;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;   # 空值时 nginx 不发送该头
    proxy_set_header Connection        $drone4d_connection_upgrade;
    # 注意：location 内一旦出现 proxy_set_header 就不再继承上面这组，因此各 location 都不再单独设置请求头
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;         # 长轮询（沙盒排队票与观看排队票）≤ 25 s

    # ---- show-api（共享展示） ---------------------------------------------------------------------------------------
    # 实时通道 awr.rt.v1：WebSocket 升级、长超时、不缓冲；每个地址前缀至多 4 条（api 侧 AWR_WS_MAX_PER_IP 同为 4）。
    # 实时观看席位满时 show-api 以 error{517} + 关闭码 4431 拒绝握手，访客转入观看排队（ADR-120）
    location = /api/rt {
        limit_conn drone4d_ws_v2 4;
        proxy_pass http://drone4d_backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 匿名 token 签发（只签 viewer；identity_token 换 admin 与 admin_secret 共用 show-api 的限流与锁定）：每前缀每分钟 30 次
    location = /api/auth/token {
        limit_req zone=drone4d_token_v2 burst=10 nodelay;
        proxy_pass http://drone4d_backend;
    }

    # 内部身份 R79、R80（ADR-123；show-api 是唯一比对点）：每前缀 0.5 次/s、突发 3；前缀、聚合前缀与全站锁定、300 ms
    # 固定时延在 show-api 内执行。请求体（口令）只经 TLS 到回环 upstream，nginx 不缓冲到磁盘（1 MiB 内存缓冲足够）
    location = /api/auth/identity {
        limit_req zone=drone4d_identity burst=3 nodelay;
        proxy_pass http://drone4d_backend;
    }

    # 观看排队 R81 至 R83（ADR-120，只在 show-api）：长轮询 ≤ 25 s
    location ^~ /api/viewer/queue {
        limit_req zone=drone4d_api_v2 burst=20 nodelay;
        proxy_pass http://drone4d_backend;
        proxy_read_timeout 60s;
    }

    # ---- sandbox-api（沙盒） ----------------------------------------------------------------------------------------
    # 会话 WS（awr.rt.v1，按会话）：每前缀 4 条（sandbox-api 另有全站 4·N_max、每会话 4）。正则含 "{"，必须加引号
    location ~ "^/api/sandbox/v1/sessions/sb-[a-z2-7]{10}/rt$" {
        limit_conn drone4d_sbws 4;
        proxy_pass http://drone4d_sandbox;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 创建沙盒（SB-04）：每前缀 2 次/min、突发 4（精确的每前缀 6 次/h、聚合前缀 12 次/h 与工作量证明在池内执行）
    location = /api/sandbox/v1/sessions {
        limit_req zone=drone4d_sb_create burst=4 nodelay;
        proxy_pass http://drone4d_sandbox;
    }

    # 容量接口（SB-71，公开、无参数、无访客标识）：1 s 微缓存，无论访客多少、上游回复什么，到达 sandbox-api ≤ 1 次/s
    # （D2-AC-42、ADR-119；容器内 nginx 1.24 的 100 客户端与故障用例见 tests/ops/test_nginx_site_e2e.py，D2-FX-R2-deploy）：
    #   1. 共享副本只由 nginx 以自己的身份回源：只回源规范路径（不带访客的查询参数与原始编码），不转发访客的任何请求头与请求体，
    #      只设 Host 与 X-Forwarded-Proto；因此副本与触发刷新的访客无关（访客自带的 X-Request-Id、Authorization 或某个前缀
    #      在 sandbox-api 内的限流状态都不会进入副本），再隐藏上游的 X-Request-Id 与 Set-Cookie。sandbox-api 把这些请求记在
    #      回环地址名下；每访客的限流在本层（drone4d_api_v2）。
    #   2. 上游的任何回复都缓存 1 s（valid any；池不可达的 503 211 同样 1 s，访客看到"容量信息暂不可用"，AWR-04 §15.6.5）。
    #      stale 只用于"正在刷新"（updating），且不用后台刷新：错误回复若按 stale 处理则不入缓存、条目一直过期，每个访客请求
    #      都会再回源一次（改前实测 100 个客户端 69 至 85 次/s，访客一直拿到过期的 200）；sandbox-api 不可达时访客拿到 502，
    #      而不是无限期的旧数据。
    #   3. 缓存键只含路径：HEAD 由 nginx 转为 GET 回源（proxy_cache_convert_head 缺省 on），与 GET 共用一份（键含方法时为两份，
    #      改前实测 2 次/s）；GET、HEAD 以外的方法 405，不回源。
    #   4. 回源的连接、发送与读取超时（1 s、3 s、3 s）小于锁等待与锁龄（5 s）：冷缓存时其余访客等锁而不各自回源（改前锁等待 2 s，
    #      上游 2.5 s 时实测 101 次）；sandbox-api 卡住时每 3 s 至多一次。
    # 上游的 Cache-Control（public, max-age=1）原样转给浏览器；X-Drone4d-Cache 便于验证（HIT、UPDATING、EXPIRED、MISS）。
    # 注意：location 内一旦出现 proxy_set_header 就不再继承 server 层那组，这里有意只设这三个（Connection 置空以保持上游长连接）
    location = /api/sandbox/v1/capacity {
        if ($request_method !~ ^(GET|HEAD)$ ) {
            return 405;
        }
        limit_req zone=drone4d_api_v2 burst=60 nodelay;
        proxy_pass http://drone4d_sandbox$uri;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_hide_header X-Request-Id;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_cache drone4d_micro;
        proxy_cache_key "$uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid any 1s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;
        proxy_cache_use_stale updating;
        proxy_cache_background_update off;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
        add_header X-Drone4d-Cache $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 其余沙盒 REST（会话、排队票长轮询 ≤ 25 s、驻留与恢复、OpenAPI 文档、信标）
    location /api/sandbox/ {
        limit_req zone=drone4d_api_v2 burst=60 nodelay;
        proxy_pass http://drone4d_sandbox;
        proxy_read_timeout 60s;
    }

    # ---- 其余 show-api REST -----------------------------------------------------------------------------------------
    location /api/ {
        limit_req zone=drone4d_api_v2 burst=60 nodelay;
        proxy_pass http://drone4d_backend;
    }

    # ---- 静态世界：nginx 直出（ADR-092、ADR-109；M11-FR-218 的对拍口径见 tests/ops/test_nginx_static_parity.py） ------
    # 七个世界：synthcity 与 UrbanScene3D 六城（经数据集权利方授权使用，ADR-109）；其余世界与隐藏路径（.geo-cache、
    # .status、.staging、.trash、.locks、world 内任何以点开头的段）一律不直出。Range（单区间 206、不可满足 416）、ETag 与
    # If-None-Match 304 由 nginx 处理；max_ranges 1：多区间请求按整体 200 返回（与 show-api 相同）。
    location ~ ^/worlds/(.*/)?\. {
        return 404;
    }
    location ~ ^/worlds/(synthcity|shenzhen|suzhou|newyork|chicago|shanghai|sanfrancisco)/world\.json$ {
        alias /opt/anet-drone4d/var/worlds/$1/world.json;
        limit_req zone=drone4d_static_v2 burst=400 nodelay;
        default_type application/json;
        etag on;
        max_ranges 1;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location ~ ^/worlds/(synthcity|shenzhen|suzhou|newyork|chicago|shanghai|sanfrancisco)/(.+)$ {
        alias /opt/anet-drone4d/var/worlds/$1/$2;
        limit_req zone=drone4d_static_v2 burst=400 nodelay;
        types {
            application/json          json;
            application/geo+json      geojson;
            application/octet-stream  bin f32 u8 u16 awrv awsl npy;
        }
        default_type application/octet-stream;
        etag on;
        max_ranges 1;
        add_header Cache-Control $drone4d_world_cc always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # 跨世界共享环境资产（湍流盒、天气图）：只有 _shared/env/
    location ~ ^/worlds/_shared/(env/.+)$ {
        alias /opt/anet-drone4d/var/worlds/_shared/$1;
        limit_req zone=drone4d_static_v2 burst=400 nodelay;
        types {
            application/json          json;
            application/octet-stream  bin f32 u8 u16 awrv awsl npy;
        }
        default_type application/octet-stream;
        etag on;
        max_ranges 1;
        add_header Cache-Control $drone4d_world_cc always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # 其余 /worlds/<x>/… 交给 show-api（它对白名单外的世界返回 404 305 problem+json）；/worlds 本身是前端路由（World Hub）
    location /worlds/ {
        limit_req zone=drone4d_static_v2 burst=200 nodelay;
        proxy_pass http://drone4d_backend;
    }

    # ---- Python SDK（M17-FR-056；AWR-04 §11.4）：当前发布的 tools/sdk/ ------------------------------------------------
    location ~ ^/sdk/(.*/)?(\.|__pycache__) {
        return 404;
    }
    location /sdk/ {
        alias /opt/anet-drone4d/current/tools/sdk/;
        limit_req zone=drone4d_static_v2 burst=50 nodelay;
        autoindex off;
        types {
            text/x-python  py;
            text/markdown  md;
        }
        default_type text/plain;
        charset utf-8;
        charset_types text/x-python text/markdown text/plain;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---- 构建信息与 PWA 清单（ADR-118、ADR-122）：每次都向服务器验证，发布切换后立即可见 -------------------------------
    location = /build-info.json {
        alias /opt/anet-drone4d/current/apps/web/dist/build-info.json;
        default_type application/json;
        etag on;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /manifest.webmanifest {
        alias /opt/anet-drone4d/current/apps/web/dist/manifest.webmanifest;
        default_type application/manifest+json;
        etag on;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---- 前端构建产物、落地页媒体与 SPA 回退（show-api） -------------------------------------------------------------
    location / {
        limit_req zone=drone4d_static_v2 burst=200 nodelay;
        proxy_pass http://drone4d_backend;
        proxy_max_temp_file_size 0;
    }
}
