# /etc/nginx/sites-available/drone4d.agentnetwork.org.cn.conf（启用：ln -s 到 sites-enabled）
# ANet Drone4D 公开演示站（T4，AWR-19 §3.7；ADR-085）。只新增本站点：本文件的 limit_req/limit_conn 区域、upstream、map 变量
# 与 SSL 会话缓存名字都带 drone4d 前缀，不与本机其他站点冲突；不修改 nginx.conf 与其他站点的任何配置。
# 证书由 certbot webroot（/var/www/certbot）以 ECDSA 申请；首次申请证书前先用 drone4d.agentnetwork.org.cn.bootstrap.conf。
# 适用 nginx 1.24（Ubuntu 24.04）：http2 写在 listen 上（http2 指令自 1.25.1 起才有）。

# ---- 限流与连接（按客户端地址；api 侧另有同口径的令牌桶与 WS 上限，17 §3.4、ADR-082） ----------------------------------
limit_req_zone  $binary_remote_addr zone=drone4d_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=drone4d_token:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=drone4d_static:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=drone4d_conn:10m;
limit_conn_zone $binary_remote_addr zone=drone4d_ws:10m;

upstream drone4d_backend {
    server 127.0.0.1:18640;   # api 只监听回环（AWR_PORT，public profile 缺省 18640）
    keepalive 16;
}

# WebSocket 升级：有 Upgrade 头时转发 upgrade，否则保持长连接（keepalive 到 upstream）
map $http_upgrade $drone4d_connection_upgrade {
    default upgrade;
    ''      '';
}

# ---- 80：只服务 ACME 校验，其余 301 到 https ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name drone4d.agentnetwork.org.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：TLS 终止与反向代理 --------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drone4d.agentnetwork.org.cn;

    ssl_certificate     /etc/letsencrypt/live/drone4d.agentnetwork.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drone4d.agentnetwork.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:drone4d_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 只对本主机名生效（不带 includeSubDomains，以免影响同域其他站点）
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;        # api 的 REST 请求体上限同为 1 MiB（17 §3.4）
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn drone4d_conn 48;     # 每个客户端地址的并发连接（HTTP/2 多路复用；点云 Range 请求走同一连接）

    # 压缩：只压文本、脚本、样式、JSON 与 SVG；点云 .bin、环境 .awrv 等二进制（application/octet-stream）与图片不压缩，
    # 206 分段响应 nginx 本就不压缩。缓存头（immutable、no-cache + ETag）由 api 给出，这里原样透传，不另加 expires。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/problem+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;   # 空值时 nginx 不发送该头
    proxy_set_header Connection        $drone4d_connection_upgrade;
    # 注意：location 内一旦出现 proxy_set_header 就不再继承上面这组，因此各 location 都不再单独设置请求头
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # 实时通道 awr.rt.v1：WebSocket 升级、长超时、不缓冲；每个客户端地址至多 4 条（api 侧 AWR_WS_MAX_PER_IP 同为 4）
    location = /api/rt {
        limit_conn drone4d_ws 4;
        proxy_pass http://drone4d_backend;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 匿名 token 签发（只签 viewer）：每个地址每分钟 30 次，突发 10
    location = /api/auth/token {
        limit_req zone=drone4d_token burst=10 nodelay;
        proxy_pass http://drone4d_backend;
    }

    location /api/ {
        limit_req zone=drone4d_api burst=60 nodelay;
        proxy_pass http://drone4d_backend;
    }

    # World Package（只有 synthcity，其余世界由 api 返回 404）：HTTP Range 由 api 处理，大块响应不在 nginx 落盘
    location /worlds/ {
        limit_req zone=drone4d_static burst=400 nodelay;
        proxy_pass http://drone4d_backend;
        proxy_max_temp_file_size 0;
    }

    # 前端构建产物、落地页媒体与 SPA 回退
    location / {
        limit_req zone=drone4d_static burst=200 nodelay;
        proxy_pass http://drone4d_backend;
        proxy_max_temp_file_size 0;
    }
}
