# /etc/nginx/sites-available/drone4d.agentnetwork.org.cn.conf（启用：ln -s 到 sites-enabled）
# 旧域名的永久跳转站点：产品更名为 ANet4D 后，公开站点迁移到 https://anet4d.agentnetwork.org.cn（站点文件
# anet4d.agentnetwork.org.cn.conf）。本文件只做两件事：
#   1. 80 端口继续服务 ACME 校验（/var/www/certbot），使旧域名的证书照常续期；其余请求 301 到新域名的同一路径与查询串；
#   2. 443 端口沿用旧域名已有的证书（/etc/letsencrypt/live/drone4d.agentnetwork.org.cn/），全部请求 301 到新域名的同一路径与
#      查询串（$request_uri 保留原始编码）。
# 不定义、也不引用任何共享内存区、upstream 或 map 变量：本机所有 anet4d_* 区只在新站点文件中定义一次；旧版本文件中的
# drone4d_* 区在换成本文件后的首次 reload 中随之释放。HSTS 与新站点相同（只对本主机名，不带 includeSubDomains）。
# 适用 nginx 1.24（Ubuntu 24.04）：http2 写在 listen 上。

# ---- 80：ACME 校验；其余 301 到新域名 --------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name drone4d.agentnetwork.org.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://anet4d.agentnetwork.org.cn$request_uri;
    }
}

# ---- 443：沿用旧域名证书，全部 301 到新域名 --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drone4d.agentnetwork.org.cn;

    ssl_certificate     /etc/letsencrypt/live/drone4d.agentnetwork.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drone4d.agentnetwork.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 301 https://anet4d.agentnetwork.org.cn$request_uri;
    }
}
