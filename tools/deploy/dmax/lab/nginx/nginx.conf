# d3-labweb 主配置：2 个 worker（容器 --cpus 1）、日志到标准输出（docker logs）、静态资源预压缩，站点配置由模板展开到 conf.d/lab.conf。
user nginx;
worker_processes 2;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { application/manifest+json webmanifest; }
  log_format lab '$time_iso8601 $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout lab;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # 压缩：构建产物在镜像构建时预压缩（.gz，gzip_static），其余文本响应即时压缩；Viewer 的 Wasm（约 51 MB）经 ZeroTier 传输时尤为必要
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript text/css application/json image/svg+xml application/wasm application/manifest+json;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include /etc/nginx/conf.d/*.conf;
}
