# d3-registry-front 主配置：1 个 worker（容器 --cpus 1）、日志到标准输出（不记录 Authorization 与查询串）、站点配置由模板展开到
# conf.d/registry.conf。临时目录在 /tmp（tmpfs），根文件系统只读。
user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # 访问日志：$uri 不含查询串（Blob 上传 URL 的 _state 参数不入日志）；$d3_principal 来自鉴权子请求的 X-D3-Principal（主体名与角色）
  log_format registry '$time_iso8601 $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time "$d3_principal" "$http_user_agent"';
  access_log /dev/stdout registry;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  include /etc/nginx/conf.d/*.conf;
}
