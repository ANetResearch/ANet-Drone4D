<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ANet Drone4D Documentation</title>
  <meta name="description" content="ANet Drone4D documentation: a real-world grounded 4D world runtime for autonomous multi-agent drones." />
  <link rel="alternate" hreflang="en" href="https://docs.agentnetwork.org.cn/drone4d/en/latest/" />
  <link rel="alternate" hreflang="zh-CN" href="https://docs.agentnetwork.org.cn/drone4d/zh-cn/latest/" />
  <link rel="alternate" hreflang="x-default" href="https://docs.agentnetwork.org.cn/drone4d/en/latest/" />
  <link rel="icon" href="en/latest/_static/img/favicon-32.png" />
  <script>
    // 按浏览器语言跳转：中文（zh、zh-CN、zh-TW、zh-Hans 等）到 zh-cn，其余到 en（与 Read the Docs 的根路径行为一致）
    (function () {
      var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'])
      var target = 'en'
      for (var i = 0; i < langs.length; i++) {
        var l = String(langs[i] || '').toLowerCase()
        if (l.indexOf('zh') === 0) { target = 'zh-cn'; break }
        if (l.indexOf('en') === 0) { target = 'en'; break }
      }
      location.replace(target + '/latest/' + location.hash)
    })()
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=en/latest/" /></noscript>
  <style>
    :root { --g900: #111214; --g500: #5C616A; --g200: #CACDD3; --white: #FBFBFC; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--white); color: var(--g900);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { text-align: center; padding: 24px; }
    img { width: 220px; height: auto; }
    p { color: var(--g500); }
    a { color: var(--g900); text-underline-offset: 3px; text-decoration-color: var(--g200); margin: 0 10px; }
  </style>
</head>
<body>
  <main>
    <img src="en/latest/_static/img/anet-logo.svg" alt="Agent Network" />
    <h1>ANet Drone4D</h1>
    <p>Choose a language / 选择语言</p>
    <p><a href="en/latest/" hreflang="en">English</a><a href="zh-cn/latest/" hreflang="zh-CN" lang="zh-CN">简体中文</a></p>
  </main>
</body>
</html>
