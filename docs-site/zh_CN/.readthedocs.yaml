# Read the Docs 构建配置：ANet Drone4D 文档站的中文翻译项目（语言 zh-cn，URL /zh-cn/latest/）。
# 在该项目设置中把 "Build configuration file" 设为 docs-site/zh_CN/.readthedocs.yaml；英文主项目使用仓库根目录的 .readthedocs.yaml。
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs-site/zh_CN/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - requirements: docs-site/requirements.txt
