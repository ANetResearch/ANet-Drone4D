# vehicles/awr_f1/params.yaml —— profile awr_f1 1.0.0（awr.vehicle.v1，schema 1.1；AWR-20 §5、§7.3、§7.8；ADR-096、ADR-115）
# AWR-F1 长航时固定翼（推进式）：通用化名称的模拟参考机型（catalog.reference = true），全部参数为 D 级。固定翼不含 L1 字段（motor、
# prop、aero、inertia_kgm2，schema 1.1 按构型条件必填）；运动学与能量由 M21 fw_kin（ADR-096）计算。派生值（AWR-20 §5.2）由
# 加载器复算并与 derived 比对（FW-1、FW-2、FW-5、FW-8，≤ 1%）。弹射起飞、伞降回收（发射回收站 launcher，crewed：需地勤回收与
# 复装，不参与无人值守 7×24）。
