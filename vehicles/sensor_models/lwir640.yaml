# vehicles/sensor_models/lwir640.yaml：传感器型号库（M21，ADR-115；AWR-04 §6.1；AWR-20 §6.4）。非制冷 VOx 640 × 512、12 µm。
# 镜头 13/25/75/100 mm（F1.0），质量与功率按镜头表（不含云台；独立云台另加 gimbal_mass_kg 0.15 kg）；N 按原生像元，数字变焦只影响显示。
# overridable[] 在 AWR-20 §7.5 的缺省列表之外加入 mass_kg、power_w：挂载文件按所选镜头写出整机质量与功率，使 M08 的挂载质量
# 检查（MNT-1，读挂载文件 mass_kg）与 M13 按镜头表计算的有效质量一致。模拟参考值，非任何真实产品（D）。
schema: awr.sensor.lwir.v1
model_id: lwir640
model_version: 1.0.0
display_name: "LWIR 640 非制冷热像"
reference: true
mass_kg: {value: 0.12, conf: D, src: "AWR-20 §6.1（25 mm 镜头）"}
power_w: {value: 1.5, conf: D, src: "AWR-20 §6.1"}
env_limits: {temp_c: [-20, 60]}
detector: {type: vox, width_px: 640, height_px: 512, pixel_um: 12, band_um: [8, 14], netd_mk: 50, netd_f_number: 1.0,
           frame_hz: 30, integration_s: 0.01}
lenses:
  - {f_mm: 13, f_number: 1.0, mass_kg: 0.09, power_w: 1.5}
  - {f_mm: 25, f_number: 1.0, mass_kg: 0.12, power_w: 1.5}
  - {f_mm: 75, f_number: 1.0, mass_kg: 0.35, power_w: 2.0}
  - {f_mm: 100, f_number: 1.0, mass_kg: 0.48, power_w: 2.0}
digital_zoom_max: 4
jitter_urad: 20
palettes: [white_hot, black_hot]
gimbal_mass_kg: 0.15
gimbal: {pitch_min_deg: -90, pitch_max_deg: 30, yaw_min_deg: -160, yaw_max_deg: 160, rate_max_deg_s: 90, integrated: false}
overridable: [mount, gimbal, lens_mm, gimbal_mass_kg, mass_kg, power_w]
conf: D
src: "AWR-20 §6.4：模拟参考值，非任何真实产品"
