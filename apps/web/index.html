<!doctype html>
<html lang="zh-CN" class="dark" data-motion="lite" data-tier="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drone4D" />
    <title>ANet Drone4D</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <style>
      /* critical boot mask CSS (M15-FR-006; styles/boot.css is the full version): paints before JavaScript runs.
         Colours are the g950 / g400 / g300 / g50 primitives of styles/theme.css written as OKLCH (no hex outside theme.css).
         The version line is filled at build time (vite.config.ts buildInfoPlugin, visible even when no script runs); the
         capacity line is written by the early boot module (GET /api/sandbox/v1/capacity).
         Loading bar (v0.3.0; app/boot/loadMeter.ts): ONE bar with ONE fill. Until the first script knows the totals it is
         indeterminate (data-state="indeterminate": a short sliding fill, static under reduced motion); then the fill scales by
         --boot-p (0..1, never decreasing) and the readout shows the stage and percent above the bar, the loaded / total bytes,
         the network throughput and the remaining time below it. role="progressbar" with aria-valuenow / aria-valuetext. */
      html, body { margin: 0; height: 100%; background: oklch(0.149 0.005 264.5); }
      #boot-mask { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: oklch(0.149 0.005 264.5); color: oklch(0.740 0.012 264.5);
        font: 500 12px/18px "Inter Variable", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      #boot-mask .boot-badge { width: 480px; max-width: calc(100vw - 2rem); height: auto; }
      #boot-mask .boot-version { margin-top: -0.5rem; min-height: 16px; font-size: 11px; line-height: 16px; letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
      #boot-mask .boot-load { display: flex; flex-direction: column; gap: 8px; width: 360px; max-width: calc(100vw - 2rem); }
      #boot-mask .boot-head, #boot-mask .boot-stats { display: flex; align-items: center; justify-content: space-between; gap: 12px;
        font-variant-numeric: tabular-nums lining-nums; }
      #boot-mask .boot-head { min-height: 18px; }
      #boot-mask .boot-phase { min-width: 0; }
      #boot-mask .boot-percent { flex: none; color: oklch(0.964 0.003 264.5); }
      #boot-mask .boot-stats { min-height: 16px; font-size: 11px; line-height: 16px; color: oklch(0.619 0.015 262.4); white-space: nowrap; }
      #boot-mask .boot-rate { text-align: right; }
      #boot-mask .boot-progress { position: relative; height: 2px; overflow: hidden; border-radius: 1px; background: oklch(1 0 0 / 0.06); }
      #boot-mask .boot-fill { display: block; width: 100%; height: 100%; background: oklch(0.964 0.003 264.5);
        transform-origin: left center; transform: scaleX(var(--boot-p, 0)); }
      #boot-mask .boot-progress[data-state="indeterminate"] > .boot-fill { width: 28%; opacity: 0.6; transform: translateX(-100%);
        animation: boot-indeterminate 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      @keyframes boot-indeterminate { to { transform: translateX(360%); } }
      @media (prefers-reduced-motion: reduce) { #boot-mask .boot-progress[data-state="indeterminate"] > .boot-fill { animation: none; opacity: 0; } }
      html:is([data-motion="reduced"], [data-motion="off"]) #boot-mask .boot-progress[data-state="indeterminate"] > .boot-fill { animation: none; opacity: 0; }
      #boot-mask .boot-capacity { min-height: 18px; max-width: calc(100vw - 2rem); text-align: center; font-variant-numeric: tabular-nums lining-nums; }
      #boot-mask .boot-capacity[hidden] { display: none; }
      #boot-mask .boot-reload { height: 32px; padding: 0 16px; border: 1px solid oklch(1 0 0 / 0.16); border-radius: 6px; background: transparent;
        color: oklch(0.964 0.003 264.5); font: inherit; cursor: pointer; }
      #boot-mask .boot-reload:hover { background: oklch(1 0 0 / 0.06); }
      @media (max-width: 1279px) { #boot-mask .boot-badge { width: 320px; } }
    </style>
  </head>
  <body>
    <div id="boot-mask" data-boot="SHELL" role="status" aria-live="polite" data-fail-zh="应用资源加载失败，请检查网络连接后重新载入"
      data-fail-reload-zh="重新载入" data-fail-en="Application resources failed to load. Check the network connection and reload."
      data-fail-reload-en="Reload">
      <img class="boot-badge" src="/brand/anet-logo.svg" width="480" height="83" alt="ANet" />
      <div class="boot-version"></div>
      <div class="boot-load">
        <div class="boot-head"><div class="boot-phase">ANet Drone4D · World Runtime</div><div class="boot-percent" aria-hidden="true"></div></div>
        <div class="boot-progress" role="progressbar" aria-label="载入进度" aria-valuemin="0" aria-valuemax="100" data-state="indeterminate"><i class="boot-fill"></i></div>
        <div class="boot-stats" aria-hidden="true"><span class="boot-bytes"></span><span class="boot-rate"></span></div>
      </div>
      <div class="boot-capacity" hidden></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
