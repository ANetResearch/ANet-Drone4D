<!doctype html>
<html lang="zh-CN" class="dark" data-motion="lite" data-tier="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ANet Drone4D</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <style>
      /* critical boot mask CSS (M15-FR-006; styles/boot.css is the full version): paints before JavaScript runs.
         Colours are the g950 / g300 / g50 primitives of styles/theme.css written as OKLCH (no hex outside theme.css). */
      html, body { margin: 0; height: 100%; background: oklch(0.149 0.005 264.5); }
      #boot-mask { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; background: oklch(0.149 0.005 264.5); color: oklch(0.740 0.012 264.5);
        font: 500 12px/18px "Inter Variable", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      #boot-mask .boot-badge { width: 480px; max-width: calc(100vw - 2rem); height: auto; }
      #boot-mask .boot-progress { width: 320px; height: 2px; background: oklch(1 0 0 / 0.06); }
      #boot-mask .boot-progress > i { display: block; height: 100%; width: 0; background: oklch(0.964 0.003 264.5); }
      @media (max-width: 1279px) { #boot-mask .boot-badge { width: 320px; } }
    </style>
  </head>
  <body>
    <div id="boot-mask" data-boot="SHELL" role="status" aria-live="polite">
      <img class="boot-badge" src="/brand/anet-logo.svg" width="480" height="83" alt="ANet" />
      <div class="boot-progress"><i></i></div>
      <div class="boot-phase">ANet Drone4D · World Runtime</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
