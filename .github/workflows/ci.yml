# Hosted CI, gate G1h (docs/18 section 12.1, docs/03 ADR-078): the no-data subset of `make ci` on a clean checkout.
# No GPU, no Chrome for Testing, no UrbanScene3D data and no built city worlds. Every command below was run on a clean
# copy of the tracked files before it was added here (docs/impl/SHOW-CI-报告.md). `make ci` stays the full local gate G1;
# `make ci-nodata` runs the same no-data steps locally.
#
# D3 regression gate (docs/05 section 4.8, D3-AC-01; seal task G05): pushes to d3-dev and pull requests into d3-dev also run
# the light gate (`make gate-d3-light`: contracts, Vitest unit, lint, import direction, resim frame digests against the D2
# baseline, public demo build with K9, the K9 D3 extension, extension point 15 build parity against v0.2.1 and the /lab/
# static build). The heavy part (D2 Python full set, zero impact relay batch, resim) runs nightly on the dmax CPU pool
# (`make gate-d3-nightly`, tools/deploy/dmax/run_d3_gate.sh); `make gate-d3-check GATE_TIER=full` joins both by tree id.
# A D3 work package merges into d3-dev only when this workflow is green for its commit.
name: ci

on:
  push:
    branches: [main, d3-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # package-lock.json records registry.npmmirror.com tarball URLs; fetch the same tarballs (the lockfile integrity
  # hashes still apply) from the public npm registry instead.
  npm_config_registry: https://registry.npmjs.org/
  npm_config_replace_registry_host: always
  PYTHON_BOOT: python3.12

jobs:
  checks:
    name: lint, contracts, tsc, vitest unit, build, demo world
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache uv and pip downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-${{ runner.os }}-py312-${{ hashFiles('requirements.lock') }}
          restore-keys: uv-${{ runner.os }}-py312-

      - name: make setup
        run: make setup
      - name: make lint
        run: make lint
      - name: make test-contracts
        run: make test-contracts
      - name: tsc --noEmit
        run: make typecheck
      - name: Vitest unit
        run: make test-web-unit
      - name: Production build
        run: make build
      - name: Demo world (synthcity, no download)
        run: make demo-world
      - name: Validate the demo world
        run: make validate-demo-world
      - name: Demo world tests (published facts, scenario loader rules)
        run: make test-demo-world

  pytest:
    name: pytest no-data, shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache uv and pip downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-${{ runner.os }}-py312-${{ hashFiles('requirements.lock') }}
          restore-keys: uv-${{ runner.os }}-py312-

      - name: make setup
        run: make setup
      - name: pytest -m "not perf and not slow and not needs_data"
        run: make test-py-nodata PYTEST_SHARD=${{ matrix.shard }}

  d3-gate:
    name: D3 regression gate, light (D3-AC-01)
    if: github.ref == 'refs/heads/d3-dev' || github.base_ref == 'd3-dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # full history and tags: demo-parity builds the D2 tag v0.2.1 from `git archive`
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache uv and pip downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-${{ runner.os }}-py312-${{ hashFiles('requirements.lock') }}
          restore-keys: uv-${{ runner.os }}-py312-

      - name: make setup
        run: make setup
      - name: Demo world (synthcity; the resim step runs on it)
        run: |
          make demo-world
          python3 -c "import json; print('synthcity contentVersion', json.load(open('worlds/synthcity/world.json'))['contentVersion'])"
      - name: make gate-d3-light
        run: make gate-d3-light
      - name: Gate evidence for this tree
        run: make gate-d3-check GATE_TIER=light
      - name: Gate report summary
        if: always()
        run: |
          tag=$(make -s gate-d3-tag)
          dir=runs/perf/d3-gate/$tag/light
          echo "D3 light gate, tree $tag" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$dir/report.json" ]; then
            python3 - "$dir/report.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          print("| step | item | result | seconds |")
          print("|---|---|---|---|")
          for k, v in r["steps"].items():
              print(f"| {k} | {v.get('item')} | {'pass' if v['pass'] else 'FAIL'} | {v.get('seconds', '')} |")
          EOF
            tail -n 40 "$dir/gate.log"
          else
            echo "no gate report" >> "$GITHUB_STEP_SUMMARY"
          fi
